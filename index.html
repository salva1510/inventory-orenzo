function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let filtered=products.filter(p=> (p.name+' '+(p.variation||'')+' '+(p.sku||'')).toLowerCase().includes(q));
  let tbody=document.getElementById('tbl'); tbody.innerHTML='';
  filtered.forEach(p=>{
    tbody.innerHTML+=`<tr><td><img src="${p.image}" class="product-img" loading="lazy"></td><td><b>${p.name}</b></td><td>${p.variation||''}</td><td style="font-size:11px">${p.sku||''}</td><td style="${p.stock<=10?'color:red;font-weight:bold':''}">${p.stock}</td><td>₱${p.price}</td></tr>`;
  });
}
render();
</script>
